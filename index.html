<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Eldoria V0.1</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101b17;color:#fff;font-family:system-ui;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}#overlay{position:absolute;inset:0;pointer-events:none}#stats{position:absolute;top:max(8px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));font-size:12px;text-shadow:1px 2px #000}#target{position:absolute;top:8px;left:45%;font-size:12px;text-shadow:1px 2px #000}#hint{position:absolute;top:8px;right:12px;font-size:11px;opacity:.8}#stick{position:absolute;bottom:max(17px,env(safe-area-inset-bottom));left:max(20px,env(safe-area-inset-left));width:112px;height:112px;border:2px solid #ffffff55;border-radius:100%;background:#ffffff13;pointer-events:auto;touch-action:none}#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;background:#d4e6d488;border-radius:50%;pointer-events:none}#buttons{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(24px,env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}button{width:65px;height:65px;border:2px solid #b9a979;border-radius:50%;background:#2b3430;color:white;font-weight:700;font-size:22px;touch-action:manipulation}button:disabled{opacity:.5}#rotate{display:none;position:absolute;inset:0;background:#102019;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;z-index:5}@media(orientation:portrait){#rotate{display:flex}}@media(max-height:370px){#stick{width:90px;height:90px}#knob{left:26px;top:26px;width:34px;height:34px}button{width:54px;height:54px}}
</style></head><body><canvas id="game"></canvas><div id="overlay"><div id="stats"></div><div id="target"></div><div id="hint">Eldoria · V0.1</div><div id="stick"><div id="knob"></div></div><div id="buttons"><button id="attack" aria-label="Ziel wählen">🎯</button><button id="skill" aria-label="Mächtiger Hieb">⚔️</button></div></div><div id="rotate">📱 Bitte drehe dein iPhone ins Querformat.</div><script>
(()=>{'use strict';const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),stats=document.querySelector('#stats'),targetEl=document.querySelector('#target'),stick=document.querySelector('#stick'),knob=document.querySelector('#knob'),skillButton=document.querySelector('#skill');let w=0,h=0,dpr=1,last=0,attackTimer=0,skillTimer=0,message='',messageUntil=0;const WORLD=1800;const saved=(()=>{try{return JSON.parse(localStorage.getItem('eldoria-save')||'{}')}catch{return {}}})();const hero={x:WORLD/2,y:WORLD/2,hp:100,maxHp:100,level:Math.max(1,Number(saved.level)||1),xp:Math.max(0,Number(saved.xp)||0),kills:Number(saved.kills)||0};let target=null;const wolves=Array.from({length:18},(_,i)=>spawn(i));function spawn(i){const a=i*2.3999,r=140+Math.sqrt(i+1)*115;return {x:Math.max(50,Math.min(WORLD-50,hero.x+Math.cos(a)*r)),y:Math.max(50,Math.min(WORLD-50,hero.y+Math.sin(a)*r)),hp:45,maxHp:45,alive:true,respawn:0,hit:0}}function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();const joy={x:0,y:0,id:null};function moveStick(e){const b=stick.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=b.width*.34,k=Math.min(1,max/(len||1));joy.x=dx*k/max;joy.y=dy*k/max;knob.style.transform='translate('+dx*k+'px,'+dy*k+'px)'}stick.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===joy.id)moveStick(e)});function release(e){if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;knob.style.transform=''}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);const keys=new Set();addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function nearest(){return wolves.filter(v=>v.alive).sort((a,b)=>distance(a,hero)-distance(b,hero))[0]||null}document.querySelector('#attack').addEventListener('click',()=>target=nearest());function damage(v,n){if(!v||!v.alive)return;v.hp-=n;v.hit=.2;if(v.hp<=0){v.alive=false;v.respawn=9;hero.kills++;hero.xp+=22;const needed=hero.level*100;if(hero.xp>=needed){hero.xp-=needed;hero.level++;hero.maxHp+=12;hero.hp=hero.maxHp;message='Levelaufstieg!';messageUntil=performance.now()+1700}if(target===v)target=null;save()}}skillButton.addEventListener('click',()=>{if(skillTimer>0)return;if(!target||!target.alive)target=nearest();if(target&&distance(hero,target)<100){damage(target,30+hero.level*3);skillTimer=5}});function save(){try{localStorage.setItem('eldoria-save',JSON.stringify({level:hero.level,xp:hero.xp,kills:hero.kills}))}catch{}}setInterval(save,10000);canvas.addEventListener('pointerdown',e=>{const x=e.clientX-w/2+hero.x,y=e.clientY-h/2+hero.y;let best=null,min=50;for(const wolf of wolves){const d=Math.hypot(wolf.x-x,wolf.y-y);if(wolf.alive&&d<min){best=wolf;min=d}}if(best)target=best});function rect(x,y,ww,hh,color){ctx.fillStyle=color;ctx.fillRect(x,y,ww,hh)}function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}function bar(x,y,width,pct,color){rect(x,y,width,5,'#321d1b');rect(x,y,width*Math.max(0,pct),5,color)}function draw(now){const dt=Math.min((now-last)/1000||0,.05);last=now;attackTimer=Math.max(0,attackTimer-dt);skillTimer=Math.max(0,skillTimer-dt);let vx=joy.x+(keys.has('d')?1:0)-(keys.has('a')?1:0),vy=joy.y+(keys.has('s')?1:0)-(keys.has('w')?1:0),m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}hero.x=Math.max(30,Math.min(WORLD-30,hero.x+vx*170*dt));hero.y=Math.max(30,Math.min(WORLD-30,hero.y+vy*170*dt));for(const wolf of wolves){if(!wolf.alive){wolf.respawn-=dt;if(wolf.respawn<=0){wolf.alive=true;wolf.hp=wolf.maxHp;wolf.x=Math.max(40,Math.min(WORLD-40,hero.x+(Math.random()-.5)*700));wolf.y=Math.max(40,Math.min(WORLD-40,hero.y+(Math.random()-.5)*500))}continue}wolf.hit=Math.max(0,wolf.hit-dt);const dist=distance(wolf,hero);if(dist<230&&dist>31){wolf.x+=(hero.x-wolf.x)/dist*47*dt;wolf.y+=(hero.y-wolf.y)/dist*47*dt}if(dist<35){wolf.hit-=dt;if(wolf.hit<=-1){hero.hp-=5;wolf.hit=0;if(hero.hp<=0){hero.hp=hero.maxHp;hero.x=hero.y=WORLD/2;message='Du wurdest besiegt!';messageUntil=now+1700}}}}if(target&&!target.alive)target=null;if(target&&distance(hero,target)<80&&attackTimer<=0){damage(target,9+hero.level*2);attackTimer=1.4}ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(w/2-hero.x,h/2-hero.y);rect(0,0,WORLD,WORLD,'#31543a');const tile=80;for(let x=0;x<WORLD;x+=tile)for(let y=0;y<WORLD;y+=tile){const v=((x*17+y*13)/80)%7;if(v<2)rect(x+12,y+20,24,17,'#395f40');if(v===3)circle(x+44,y+45,4,'#8da969')}rect(WORLD/2-120,0,240,WORLD,'#756f50');rect(0,WORLD/2-100,WORLD,200,'#756f50');for(let i=0;i<65;i++){const x=(i*311+77)%WORLD,y=(i*229+130)%WORLD;if(Math.abs(x-WORLD/2)<145||Math.abs(y-WORLD/2)<125)continue;circle(x,y,25,'#193f2d');circle(x-7,y-8,19,'#276341');circle(x+10,y+2,15,'#317348')}for(const wolf of wolves){if(!wolf.alive)continue;if(target===wolf){ctx.strokeStyle='#e9c761';ctx.lineWidth=3;ctx.beginPath();ctx.arc(wolf.x,wolf.y,24,0,Math.PI*2);ctx.stroke()}circle(wolf.x,wolf.y,15,wolf.hit>0?'#e7b0a1':'#66594b');circle(wolf.x-7,wolf.y-9,7,'#7a6b56');circle(wolf.x+7,wolf.y-9,7,'#7a6b56');bar(wolf.x-22,wolf.y-28,44,wolf.hp/wolf.maxHp,'#d64c45')}circle(hero.x,hero.y+7,19,'#19281f');circle(hero.x,hero.y,15,'#b7bec8');rect(hero.x-10,hero.y-10,20,16,'#667788');rect(hero.x+11,hero.y-11,5,26,'#d6c8a0');circle(hero.x,hero.y-13,9,'#e5d8c0');bar(hero.x-23,hero.y-35,46,hero.hp/hero.maxHp,'#57d075');ctx.restore();stats.textContent='⚔️ Krieger · Level '+hero.level+' | ❤️ '+Math.ceil(hero.hp)+'/'+hero.maxHp+' | ✨ XP '+hero.xp+'/'+(hero.level*100)+' | 🐺 '+hero.kills;targetEl.textContent=target?'🐺 Wolf '+Math.max(0,Math.ceil(target.hp))+'/'+target.maxHp:'';skillButton.textContent=skillTimer>0?Math.ceil(skillTimer)+'s':'⚔️';if(now<messageUntil){ctx.font='bold 24px system-ui';ctx.textAlign='center';ctx.fillStyle='#ffe6a0';ctx.fillText(message,w/2,h*.3)}requestAnimationFrame(draw)}requestAnimationFrame(draw);
})();
</script></body></html>
